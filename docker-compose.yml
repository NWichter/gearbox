services:
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    environment:
      SERVICE_FQDN_WEB: ${SERVICE_FQDN_WEB}
      SITE_PASSWORD: ${SITE_PASSWORD:-}
    depends_on: [api]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    networks: [default]

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-anthropic/claude-sonnet-5}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      READ_ONLY: ${READ_ONLY:-false}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    volumes:
      - uploads:/data/uploads
    networks: [default, dbstack]

volumes:
  uploads:

networks:
  dbstack:
    external: true
